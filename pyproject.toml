[project]
name = "sageml"
version = "0.1.4"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2025.4.26",
    "matplotlib>=3.10.1",
    "numpy>=2.2.5",
    "optuna>=4.3.0",
    "pandas>=2.2.3",
    "pyballmapper>=0.3.7",
    "requests>=2.32.3",
    "ripser>=0.6.12",
    "scikit-learn>=1.6.1",
    "scikit-posthocs>=0.11.4",
    "torch>=2.7.0",
    "tqdm>=4.67.1",
    "xgboost>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sageml*"]

[dependency-groups]
dev = [
    "click>=8.1.8",
    "pydataset>=0.2.0",
    "pytest>=8.3.5",
]

[project.scripts]
sagedev = "sageml.dev.__main__:cli"
